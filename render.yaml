services:
  - type: web
    name: document-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONFIG_PATH
        value: configs/default.yaml
      - key: PYTHON_VERSION
        value: "3.11"
