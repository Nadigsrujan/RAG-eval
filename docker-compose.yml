services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./indices:/app/indices
      - ./traces:/app/traces
      - ./logs:/app/logs
    environment:
      - CONFIG_PATH=configs/default.yaml
    restart: unless-stopped

