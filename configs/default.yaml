# ═══════════════════════════════════════════════════════════════
# Multimodal Document Intelligence — Pipeline Configuration
# ═══════════════════════════════════════════════════════════════

ingestion:
  chunk_size: 300          # tokens per chunk
  chunk_overlap: 50        # overlap between consecutive chunks
  pdf_parser: pdfplumber   # pdfplumber | pypdf2

retrieval:
  bm25_enabled: true
  dense_enabled: true
  top_k_initial: 20        # candidates before reranking
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  fusion_method: rrf       # rrf (reciprocal rank fusion) | weighted
  fusion_weights:
    bm25: 0.4
    dense: 0.6

reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k_final: 5           # final contexts after reranking

generation:
  model: Qwen/Qwen3-4B-Instruct-2507
  max_new_tokens: 500
  max_input_tokens: 2048
  temperature: 0.1
  prompt_version: v1

evaluation:
  enabled: true
  dataset: evaluation/datasets/eval_set.jsonl

observability:
  tracing_enabled: true
  metrics_enabled: true
  log_level: INFO
  trace_dir: traces/
  log_dir: logs/

experiments:
  tracker: json            # json | mlflow
  results_dir: experiments/results/

orchestration:
  enabled: true
  agentic_query_enabled: true
  min_retrieval_confidence: 0.10
  faithfulness_threshold: 0.70
  sla_thresholds:
    recall_at_5: 0.60
    mrr: 0.50
    contains_match: 0.50
    citation_score: 0.70
